[project]
name = "sales-database"
version = "0.1.0"
description = "Shared database schema, migrations, and demo data tooling for the Supplier BI MVP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "pwdlib[argon2]>=0.2,<1",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sales_db"]
