[project]
name = "retail-bi-backend"
version = "0.1.0"
description = "Layered FastAPI backend for authentication and trusted supplier context"
authors = [
    { name = "Wille Kolu", email = "wille.kolu10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "google-adk>=2.6.3",
    "litellm>=1.80.0",
    "mcp>=1.28,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
