[project]
name = "sales-mcp-server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Wille Kolu", email = "wille.kolu10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1",
    "psycopg[binary]>=3.0,<4.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
sales-mcp-server = "sales_mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
